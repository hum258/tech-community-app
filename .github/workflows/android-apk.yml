name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Diagnose Expo autolinking metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > expo-autolinking.json
          node -e "const x=require('./expo-autolinking.json'); for (const [i,m] of x.modules.entries()) console.log(JSON.stringify({index:i,packageName:m.packageName,packageVersion:m.packageVersion,projects:m.projects},null,2))"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tech-community-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
