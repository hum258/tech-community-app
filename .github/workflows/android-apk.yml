name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android

      - name: Diagnose Expo autolinking metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > expo-autolinking.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('expo-autolinking.json', 'utf8'));
          const modules = data.modules || [];
          const report = modules.map((m, index) => ({
            index,
            packageName: m.packageName,
            packageVersion: m.packageVersion,
            projects: m.projects
          }));
          console.log(JSON.stringify(report, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Expo autolinking modules\\n\\n`' +
            report.map(m => `${m.index}: ${m.packageName || 'unknown'}@${m.packageVersion || 'no-version'}`).join('`\\n`') +
            '`\\n');
          NODE

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tech-community-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            expo-autolinking.json
            android/settings.gradle
          if-no-files-found: warn
